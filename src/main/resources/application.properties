spring.main.web-application-type=none
server.port=8080

spring.datasource.url=jdbc:duckdb:${logslim.db.path:logs.duckdb}
spring.datasource.driver-class-name=org.duckdb.DuckDBDriver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-test-query=SELECT 1

# Schema init: always run schema.sql; continue-on-error lets post-compact view conflicts pass through
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Logging — suppress Spring banner noise in CLI output
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.logslim=INFO

# Ingestion
logslim.ingestion.batch-size=1000
logslim.ingestion.queue-size=50000
logslim.ingestion.worker-threads=8
logslim.ingestion.queue-poll-timeout-ms=100

# Template extraction
logslim.template.similarity-threshold=0.95
logslim.template.max-count=100000

# Storage
logslim.storage.batch-insert-size=500

# Query
logslim.query.default-page-size=50
