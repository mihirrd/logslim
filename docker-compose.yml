services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dockermihird/logslim:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - JAVA_TOOL_OPTIONS=-Dlogslim.db.path=/data/logs.duckdb
    command: serve

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080/api
